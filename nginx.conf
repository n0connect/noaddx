server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Zero telemetry: no access log (it would record IP, time and path of every request),
    # and only critical errors (lower levels can include client addresses)
    access_log off;
    error_log /dev/stderr crit;

    root /usr/share/nginx/html;
    index index.html;

    # Include default MIME types and ensure SVG files are served correctly
    include /etc/nginx/mime.types;
    types {
        image/svg+xml svg svgz;
    }

    # Error pages
    error_page 404 /e0ab670f-6801-4475-b337-c08d5adb9e73.html;

    # Security headers for frontend (SPA)
    # worker-src 'self' allows Web Workers (used by PoW computation in registration)
    # Trusted Types: one policy (noaddx-worker) that whitelists the PoW worker URL; every other sink throws
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; require-trusted-types-for 'script'; trusted-types noaddx-worker;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), interest-cohort=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
    # Cross-origin isolation: the app loads nothing from other origins
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Static files - CSS, JS, fonts, images
    location ~ \.(css|js|ttf|woff|woff2|png|jpg|jpeg|gif|svg|ico)$ {
        # `expires` instead of add_header: any add_header here would silently drop every
        # server-level security header (nosniff, CSP, CORP...) for these files
        expires 1h;
        try_files $uri =404;
    }
    
    # Static directories
    location ~ ^/(fonts|images|js)/ {
        try_files $uri =404;
    }

    # Server-Sent Events: long-lived and unbuffered; errors are NOT intercepted so
    # EventSource sees the real status (401 = session revoked)
    location = /api/v2/events {
        proxy_pass http://noaddx-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
        gzip off;
    }

    # Proxy API requests to backend (same-origin via /api)
    # ZERO-TRUST: Only trust headers set by Nginx, not client-controlled headers
    location /api/ {
        proxy_pass http://noaddx-backend:8080;
        
        # ZERO-TRUST: Override any client-provided proxy headers with Nginx-controlled values
        # proxy_set_header automatically overrides client headers, preventing header injection
        # Backend trusts forwarded headers only from TRUSTED_PROXIES (see backend/internal/middleware/trustedproxy.go)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SECURITY: Use $remote_addr only, not $proxy_add_x_forwarded_for
        # This prevents client manipulation of X-Forwarded-For chain
        # Backend doesn't use X-Forwarded-For (only X-Real-IP), but we set it correctly anyway
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Intercept backend errors and redirect to status pages
        # Note: This works for proxy errors, but JSON responses from backend
        # are handled by frontend JavaScript error handler
        proxy_intercept_errors on;
        error_page 400 /76e556a4-0575-4d98-a663-73b1080f26df.html;
        error_page 401 /90b6b048-4bc9-4083-8585-9063c8e7332e.html;
        error_page 403 /cb012905-229f-4bf6-bdf4-8778ab34d8d7.html;
        error_page 404 /e0ab670f-6801-4475-b337-c08d5adb9e73.html;
        error_page 429 /8ec9c7e3-a58c-40b1-a918-f8cc67c4fc59.html;
        error_page 500 502 503 504 /9a24ed32-d32d-4b4b-a70e-a0bfd39f6710.html;
    }
    
    # Status pages - ensure they are accessible
    location ~ ^/(76e556a4-0575-4d98-a663-73b1080f26df|90b6b048-4bc9-4083-8585-9063c8e7332e|cb012905-229f-4bf6-bdf4-8778ab34d8d7|e0ab670f-6801-4475-b337-c08d5adb9e73|8ec9c7e3-a58c-40b1-a918-f8cc67c4fc59|9a24ed32-d32d-4b4b-a70e-a0bfd39f6710)\.html$ {
        try_files $uri =404;
    }
    
    # Root path - serve index.html for SPA
    location = / {
        try_files /index.html =404;
    }
    
    # All other paths - return 404 (error_page will handle showing 404 page)
    location / {
        return 404;
    }
}