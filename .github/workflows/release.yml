name: release

# make release pushes noaddx-{openssl,native}-vX.Y.Z; each tag gets a release carrying the
# frontend manifest and its Sigstore signature, so anyone can check that an instance serves
# exactly the released client (docs/security/verifying-the-client.md).
on:
  push:
    tags: ['noaddx-openssl-v*', 'noaddx-native-v*']

permissions: {}

jobs:
  frontend-manifest:
    name: signed frontend manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release, upload its assets
      id-token: write # keyless signature bound to this workflow, repository and tag
    steps:
      # This job can sign and publish: every action is pinned, and the checkout keeps no token
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: make manifest
      # Third-party code in the signing path: pinned to a commit, cosign to a release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - run: cosign sign-blob --yes --bundle frontend.sha256.sigstore.json frontend.sha256
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" frontend.sha256 frontend.sha256.sigstore.json --clobber
