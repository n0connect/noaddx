# Rendered by the nginx image at start (templates/default.conf.template -> conf.d/default.conf):
# ${TOR_IP} below is the tor container's fixed address. Everything else is in nginx-site.conf.

# The client address: the TCP peer, or the Tor circuit that the onion listener's PROXY header
# names. The clearnet listener never parses PROXY headers, so there it is always the peer.
map $proxy_protocol_addr $client_addr {
    ""      $remote_addr;
    default $proxy_protocol_addr;
}

# Coarse per-client limit in front of every API route (the backend adds per-client,
# per-account and per-identity limits). In-memory only; nothing is logged.
limit_req_zone $client_addr zone=api:10m rate=20r/s;
limit_req_status 429;

# Clearnet: http://localhost in development; put TLS in front of it for any network
server {
    listen 80;
    server_name localhost;
    include /etc/nginx/noaddx/site.conf;
}

# Onion service (make onion): only the tor container may connect, and every connection must
# open with a PROXY header naming its circuit (HiddenServiceExportCircuitID haproxy). Nothing
# else can reach this port, so nobody else can claim to be a Tor circuit.
server {
    listen 8081 proxy_protocol;
    server_name _;
    allow ${TOR_IP};
    deny all;
    include /etc/nginx/noaddx/site.conf;
}
