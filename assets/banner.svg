<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 246 52" width="246" height="52">
  <style>
    .ascii {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 9px;
      line-height: 11px;
      font-weight: 700;
      fill: #1f2328;
      white-space: pre;
    }
