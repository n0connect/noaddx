name: release

# make release pushes noaddx-{openssl,native}-vX.Y.Z; each tag gets a release carrying the
# frontend manifest and its Sigstore signature, so anyone can check that an instance serves
# exactly the released client (docs/security/verifying-the-client.md).
on:
  push:
    tags: ['noaddx-openssl-v*', 'noaddx-native-v*']

permissions: {}

jobs:
  frontend-manifest:
    name: signed frontend manifest
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release, upload its assets
      id-token: write # keyless signature bound to this workflow, repository and tag
    steps:
      - uses: actions/checkout@v4
      - run: make manifest
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign-blob --yes --bundle frontend.sha256.sigstore.json frontend.sha256
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" frontend.sha256 frontend.sha256.sigstore.json --clobber
