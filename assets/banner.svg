    <tspan x="8" y="23">  _ _    ___   __ _   __| |  __| |  __ __ </tspan>
    <tspan x="8" y="34"> | &apos; \  / _ \ / _` | / _` | / _` |  \ \ / </tspan>
    <tspan x="8" y="45"> |_||_| \___/ \__,_| \__,_| \__,_|  /_\_\ </tspan><tspan class="dot">.</tspan>
