# docker-compose.test.yaml - Test environment
# Usage: make test

name: noaddress-test

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: noaddress-postgres-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: noaddress_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  test-runner:
    build:
      context: .
      dockerfile: test.Dockerfile
    container_name: noaddress-test-runner
    depends_on:
      postgres-test:
        condition: service_healthy
    # JWT_SECRET, MASTER_KEY_ACTIVE and ACCOUNT_LOOKUP_PEPPER are generated from the CSPRNG
    # inside the test binary (tests/testutil/env.go); no secret lives in this file.
    environment:
      APP_ENV: test
      LOG_LEVEL: error
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: noaddress_test
      DB_SSL_MODE: disable
      JWT_SECRET_MIN_LEN: "32"
      JWT_EXPIRATION_MINUTES: "15"
      JWT_ISSUER: "noaddress-backend"
      JWT_AUDIENCE: "noaddress-web"
      MASTER_KEY_ACTIVE_ID: "test-key-1"
      MAX_REQUEST_BODY_BYTES: "1048576"
      MAX_JSON_DEPTH: "2"
      INVITE_TTL_SEC: "86400"
      MAX_ACTIVE_INVITES: "5"
      MAX_CONVERSATIONS_PER_USER: "256"
      MAX_MESSAGE_BYTES: "8192"
      MESSAGE_PAGE_LIMIT: "200"
      MESSAGE_TTL_DAYS: "7"
      POW_DIFFICULTY: "18"
      ARGON2_MEMORY_KIB: "16384"
      ARGON2_TIME: "1"
      ARGON2_PARALLELISM: "2"
      ARGON2_SALT_LENGTH: "16"
      ARGON2_HASH_LENGTH: "32"
      PENDING_TOKEN_TTL_SEC: "300"
      PENDING_CLEANUP_INTERVAL_SEC: "60"
      PENDING_ID_BYTES: "16"
      INTERNAL_ID_LENGTH: "24"
      RATE_LIMIT_MAX_TOKENS: "1000"
      RATE_LIMIT_REFILL_INTERVAL_SEC: "1"
      RATE_LIMIT_CLEANUP_INTERVAL_SEC: "300"
      RATE_LIMIT_MAX_BUCKETS: "10000"
      BACKEND_PORT: "8080"
      SERVER_READ_HEADER_TIMEOUT_SEC: "5"
      SERVER_READ_TIMEOUT_SEC: "15"
      SERVER_WRITE_TIMEOUT_SEC: "15"
      SERVER_IDLE_TIMEOUT_SEC: "60"
      SERVER_MAX_HEADER_BYTES: "8192"
      ALLOWED_ORIGINS: "http://localhost:3000"
    volumes:
      - ./test-results:/test-results
